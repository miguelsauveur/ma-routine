<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e23e6b">
<title>Ma routine — coach débutante</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf6f3; --surface:#ffffff; --surface-2:#f6eee9;
  --ink:#2a1e2e; --ink-soft:#6d6270; --line:#ece2dc;
  --berry:#e23e6b; --berry-soft:#fbe4ec; --berry-ink:#b21f49;
  --teal:#0f7a6b; --teal-soft:#dcf1ed;
  --amber:#c77a12;
  --shadow:0 6px 24px rgba(74,44,58,.08);
  --r:20px; --r-sm:14px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --font-d:"Bricolage Grotesque",-apple-system,system-ui,sans-serif;
  --font-b:"Instrument Sans",-apple-system,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#181218; --surface:#241a26; --surface-2:#2e2231;
    --ink:#f3ebf0; --ink-soft:#a99caf; --line:#372a3b;
    --berry:#ff6f97; --berry-soft:#3a1d2a; --berry-ink:#ff8fae;
    --teal:#4cc9b6; --teal-soft:#123029;
    --amber:#e0a545;
    --shadow:0 6px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#181218; --surface:#241a26; --surface-2:#2e2231;
  --ink:#f3ebf0; --ink-soft:#a99caf; --line:#372a3b;
  --berry:#ff6f97; --berry-soft:#3a1d2a; --berry-ink:#ff8fae;
  --teal:#4cc9b6; --teal-soft:#123029;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--font-b); font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--font-d);margin:0;line-height:1.1;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#app{max-width:520px;margin:0 auto;min-height:100vh;padding:0 18px calc(96px + var(--safe-b));position:relative}
.screen{padding-top:22px;animation:rise .28s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px}
.hi{font-size:30px;font-weight:800}
.sub{color:var(--ink-soft);font-size:15px;margin-top:4px}
.phase-chip{background:var(--berry-soft);color:var(--berry-ink);font-weight:600;font-size:13px;
  padding:8px 12px;border-radius:999px;white-space:nowrap}

/* cards */
.card{background:var(--surface);border-radius:var(--r);padding:18px;margin-bottom:14px;
  box-shadow:var(--shadow)}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.card-title{font-family:var(--font-d);font-weight:700;font-size:18px;margin-bottom:14px}
.muted{color:var(--ink-soft)}
.small{font-size:13.5px}

/* week summary */
.wk{display:flex;gap:10px}
.wk .stat{flex:1;background:var(--surface-2);border-radius:var(--r-sm);padding:14px 12px;text-align:center}
.stat .n{font-family:var(--font-d);font-weight:800;font-size:26px;line-height:1}
.stat .l{font-size:12px;color:var(--ink-soft);margin-top:6px}

/* progress bar */
.bar{height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:12px 0 6px}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--berry),var(--teal));border-radius:99px;transition:width .5s ease}
.bar-labels{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft)}

/* day list */
.day{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.day .emj{font-size:26px;width:44px;height:44px;display:grid;place-items:center;background:var(--surface-2);border-radius:12px;flex-shrink:0}
.day .txt{flex:1;min-width:0}
.day .d{font-size:12px;font-weight:600;color:var(--ink-soft);letter-spacing:.03em}
.day .t{font-family:var(--font-d);font-weight:700;font-size:16px;margin-top:1px}
.day.done{border-color:var(--teal);background:var(--teal-soft)}
.day.done .check{color:var(--teal);font-size:22px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--berry);color:#fff;font-weight:600;font-size:16px;
  padding:14px 20px;border-radius:14px;min-height:52px;width:100%;
  transition:transform .1s ease,filter .15s ease}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.teal{background:var(--teal)}
.btn.sm{min-height:44px;padding:10px 16px;font-size:15px;width:auto}
.btn.outline{background:transparent;border:1.5px solid var(--berry);color:var(--berry)}
.btn.mini{background:var(--berry);color:#fff;padding:9px 16px;min-height:auto;font-size:14px;width:auto;border-radius:11px}

.motiv{background:linear-gradient(135deg,var(--berry-soft),var(--teal-soft));border-radius:var(--r);
  padding:18px;font-family:var(--font-d);font-weight:700;font-size:18px;margin-bottom:14px;line-height:1.25}

/* bottom nav */
nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);
  padding:8px 6px calc(8px + var(--safe-b));display:flex;z-index:40;max-width:520px;margin:0 auto}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--ink-soft);font-size:11px;font-weight:600}
nav button .ic{font-size:22px;line-height:1}
nav button.on{color:var(--berry)}

/* fields */
.field{margin-bottom:14px}
.field label{display:block;font-size:13.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
.inp{width:100%;background:var(--surface-2);border:1px solid transparent;border-radius:12px;
  padding:13px 14px;color:var(--ink);outline:none}
.inp:focus{border-color:var(--berry)}
.row2{display:flex;gap:10px}
.row2>*{flex:1}

/* progression / goals */
.big-metric{text-align:center;padding:6px 0 2px}
.big-metric .kg{font-family:var(--font-d);font-weight:800;font-size:52px;line-height:1}
.big-metric .kg small{font-size:22px;font-weight:700;color:var(--ink-soft)}
.trio{display:flex;gap:10px;margin-top:14px}
.trio .b{flex:1;text-align:center;background:var(--surface-2);border-radius:var(--r-sm);padding:12px 6px}
.trio .b .v{font-family:var(--font-d);font-weight:800;font-size:20px}
.trio .b .k{font-size:11.5px;color:var(--ink-soft);margin-top:3px}
.milestones{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.ms{padding:8px 12px;border-radius:999px;font-weight:600;font-size:14px;background:var(--surface-2);color:var(--ink-soft)}
.ms.hit{background:var(--teal-soft);color:var(--teal)}
.ms.next{background:var(--berry-soft);color:var(--berry-ink);box-shadow:0 0 0 2px var(--berry) inset}

/* calendar */
.calrow{display:flex;justify-content:space-between;gap:6px;margin-top:8px}
.calcell{flex:1;text-align:center}
.calcell .dn{font-size:11px;color:var(--ink-soft);font-weight:600;margin-bottom:6px}
.calcell .dot{height:40px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:var(--surface-2)}
.calcell .dot.done{background:var(--teal-soft);color:var(--teal)}
.calcell .dot.plan{background:var(--berry-soft);color:var(--berry-ink)}
.calcell .dot.rest{color:var(--ink-soft)}

.histrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.histrow:last-child{border-bottom:none}
.histrow .e{font-size:20px}
.histrow .d{font-size:12.5px;color:var(--ink-soft)}

/* session overlay */
.session{position:fixed;inset:0;background:var(--bg);z-index:60;max-width:520px;margin:0 auto;
  display:flex;flex-direction:column;padding:18px 18px calc(18px + var(--safe-b))}
.sess-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sess-top .x{font-size:15px;color:var(--ink-soft);font-weight:600}
.sess-prog{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:18px}
.sess-prog>span{display:block;height:100%;background:var(--berry);transition:width .3s ease}
.sess-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ex-name{font-family:var(--font-d);font-weight:800;font-size:30px;margin-bottom:6px}
.ex-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tag{background:var(--surface-2);color:var(--ink-soft);font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px}
.tag.rep{background:var(--berry-soft);color:var(--berry-ink)}
.tag.vid{background:var(--berry);color:#fff;text-decoration:none}
.goal-focus{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:12px 14px;font-size:13.5px;font-weight:600;color:var(--ink-soft);margin-bottom:14px;text-align:center}
.suggest{background:var(--teal-soft);color:var(--teal);border-radius:var(--r-sm);padding:12px 14px;font-size:14px;font-weight:600;margin-bottom:14px;display:flex;gap:9px}
.suggest.hold{background:var(--surface-2);color:var(--ink-soft)}
.technique{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:16px;overflow:hidden}
.technique summary{padding:13px 16px;font-weight:600;list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.technique summary::-webkit-details-marker{display:none}
.technique[open] summary{border-bottom:1px solid var(--line)}
.technique .content{padding:14px 16px;font-size:14.5px;color:var(--ink-soft);line-height:1.55}
.technique .content b{color:var(--ink)}
.setrow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:10px}
.setrow .sl{font-weight:600;width:66px;flex-shrink:0}
.setrow .inp{background:var(--surface-2)}
.setctl{display:flex;gap:10px;margin:2px 0 18px}
.setctl button{font-size:13.5px;color:var(--berry);font-weight:600;padding:6px 2px}
.feedback h3{font-size:20px;margin-bottom:14px;text-align:center}
.fbopts{display:flex;flex-direction:column;gap:10px}
.fbopt{padding:15px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);font-weight:600;font-size:16px;text-align:left;transition:.12s}
.fbopt:active{transform:scale(.99)}
.fbopt.sel{border-color:var(--berry);background:var(--berry-soft);color:var(--berry-ink)}
.sess-foot{padding-top:12px}

/* rest timer */
.rest-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring{position:relative;width:230px;height:230px;margin-bottom:8px}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num .t{font-family:var(--font-d);font-weight:800;font-size:56px}
.ring .num .lab{color:var(--ink-soft);font-size:14px;margin-top:2px}
.rest-btns{display:flex;gap:10px;margin-top:26px;width:100%}

.warn{background:var(--surface-2);border-radius:var(--r-sm);padding:14px;font-size:13px;color:var(--ink-soft);line-height:1.55}
.link{color:var(--berry);font-weight:600;text-decoration:none}
.chiplist{display:flex;gap:8px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:10px;padding:12px 0}
.switch{width:46px;height:28px;background:var(--surface-2);border-radius:99px;position:relative;transition:.2s;flex-shrink:0}
.switch.on{background:var(--teal)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;background:#fff;border-radius:99px;transition:.2s}
.switch.on::after{left:21px}
.celebrate{text-align:center;padding:30px 10px}
.celebrate .em{font-size:60px}
.celebrate h2{font-size:26px;margin:12px 0 6px}
.divider{height:1px;background:var(--line);margin:16px 0}
.secret-heart{text-align:center;font-size:20px;opacity:.14;padding:34px 0 12px;user-select:none;transition:opacity .2s}
.secret-heart:active{opacity:.5}
.letter{position:fixed;inset:0;z-index:90;max-width:520px;margin:0 auto;overflow-y:auto;
  background:linear-gradient(165deg,var(--berry-soft),var(--bg) 52%,var(--teal-soft));
  padding:44px 26px calc(40px + var(--safe-b));animation:rise .45s ease}
.letter .heart{font-size:46px;text-align:center;margin-bottom:16px}
.letter h2{font-family:var(--font-d);font-weight:800;font-size:27px;text-align:center;margin-bottom:24px}
.letter p{font-size:16.5px;line-height:1.7;margin:0 0 16px}
.letter p.sign{font-family:var(--font-d);font-weight:700;font-size:19px;margin-top:6px}
.letter .close{margin-top:22px}
.ms.hit{cursor:pointer}
.libitem{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:14px 16px;margin-bottom:10px;text-align:left}
.libitem:active{background:var(--surface-2)}
.li-n{font-family:var(--font-d);font-weight:700;font-size:16px}
.li-m{font-size:13px;color:var(--ink-soft);margin-top:2px}
.li-go{color:var(--berry);font-size:18px;flex-shrink:0}
.exsheet{position:fixed;inset:0;z-index:90;max-width:520px;margin:0 auto;overflow-y:auto;
  background:var(--bg);padding:44px 22px calc(30px + var(--safe-b));animation:rise .3s ease}
.x2{position:absolute;top:16px;right:18px;font-size:22px;color:var(--ink-soft)}
.exbody{margin:14px 0 22px}
.exbody p{font-size:15.5px;line-height:1.6;margin:0 0 14px;color:var(--ink)}
.exbody b{color:var(--ink)}
</style>
</head>

/* ---------------- HELPERS ---------------- */
function mondayOf(d){const x=new Date(d);const g=(x.getDay()+6)%7;x.setDate(x.getDate()-g);x.setHours(0,0,0,0);return x;}
function weekKey(d){return mondayOf(d).toISOString().slice(0,10);}
function currentWeek(){return weekKey(new Date());}
function sessionsThisWeek(){const w=currentWeek();return S.sessions.filter(s=>weekKey(s.date)===w);}
function dayDoneThisWeek(k){return sessionsThisWeek().some(s=>s.dayKey===k);}
function currentWeekNumber(){
  const diff=Math.floor((mondayOf(new Date())-mondayOf(S.profile.startDate))/(7*864e5));
  return Math.max(1,diff+1);
}
function phase(){
  const w=currentWeekNumber();
  if(w<=2)return{n:1,name:"Apprendre",wk:w};
  if(w<=4)return{n:2,name:"S'habituer",wk:w};
  if(w<=8)return{n:3,name:"Progresser",wk:w};
  return{n:4,name:"En autonomie",wk:w};
}
function latestWeight(){return S.weights.length?S.weights[S.weights.length-1].kg:S.profile.startWeight;}
function avgWeight(){ // moyenne 7 derniers jours si assez de données, sinon dernière mesure
  if(S.weights.length<3)return latestWeight();
  const cutoff=Date.now()-7*864e5;
  const recent=S.weights.filter(w=>new Date(w.date).getTime()>=cutoff);
  const use=recent.length>=2?recent:S.weights.slice(-3);
  return use.reduce((a,w)=>a+w.kg,0)/use.length;
}
function displayWeight(){return avgWeight();}
function progressPct(){
  const s=S.profile.startWeight,g=S.profile.goalWeight,c=displayWeight();
  if(s===g)return 100;
  return Math.max(0,Math.min(100,((s-c)/(s-g))*100));
}
function lastLog(exId){ // dernier enregistrement d'un exercice
  for(let i=S.sessions.length-1;i>=0;i--){
    const e=S.sessions[i].exercises.find(x=>x.id===exId);
    if(e)return e;
  }
  return null;
}
function suggestion(exId){
  const t=TECH[exId],last=lastLog(exId);
  if(!last||t.type==="time"||!t.rep)return null;
  const top=t.rep[1];
  const maxReps=Math.max(...(last.sets||[0]));
  const easy=["Très facile","Facile","Correct"].includes(last.difficulty);
  const hard=last.difficulty==="Très difficile";
  if(hard)return{hold:true,txt:"La dernière fois c'était très difficile — reste sur le même poids, la technique d'abord."};
  if(maxReps>=top&&easy)return{hold:false,txt:"Prochaine fois : essaye légèrement plus lourd si tu te sens à l'aise 👍"};
  return null;
}

function chartSVG(){
  const W=S.weights;
  if(W.length<2)return `<div class="warn">Enregistre ton poids régulièrement pour voir apparaître ta courbe 🌱</div>`;
  const w=300,h=150,pad=10;
  const xs=W.map(p=>new Date(p.date).getTime());
  const minX=Math.min(...xs),maxX=Math.max(...xs)||minX+1;
  const ys=W.map(p=>p.kg).concat([S.profile.goalWeight]);
  let minY=Math.min(...ys)-1,maxY=Math.max(...ys)+1;
  const X=t=>pad+(maxX===minX?0.5:(t-minX)/(maxX-minX))*(w-2*pad);
  const Y=v=>pad+(1-(v-minY)/(maxY-minY))*(h-2*pad);
  const pts=W.map(p=>`${X(new Date(p.date).getTime()).toFixed(1)},${Y(p.kg).toFixed(1)}`).join(" ");
  const gy=Y(S.profile.goalWeight).toFixed(1);
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">
    <line x1="${pad}" y1="${gy}" x2="${w-pad}" y2="${gy}" stroke="var(--teal)" stroke-width="1.5" stroke-dasharray="4 4" opacity=".7"/>
    <text x="${w-pad}" y="${(+gy-5)}" text-anchor="end" font-size="10" fill="var(--teal)">objectif ${S.profile.goalWeight}</text>
    <polyline points="${pts}" fill="none" stroke="var(--berry)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${W.map(p=>`<circle cx="${X(new Date(p.date).getTime()).toFixed(1)}" cy="${Y(p.kg).toFixed(1)}" r="3" fill="var(--berry)"/>`).join("")}
  </svg>`;
}

function startWorkout(dayKey){
  const d=DAYS[dayKey];
  const ex=d.ex.map(id=>{const t=TECH[id],last=lastLog(id);
    return {id,name:t.n,setsCount:t.set||3,type:t.type||"reps",
      weight:last?last.weight:"", sets:new Array(t.set||3).fill(""), difficulty:null,
      done:false};
  });
  active.workout={dayKey,name:d.title,startTime:Date.now(),idx:0,exercises:ex,intro:true};
  active.step="exercise";active.feedbackSel=null;
  render();
}
function renderSession(){
  const w=active.workout,ov=document.getElementById("overlay");
  const d=DAYS[w.dayKey];
  if(w.intro){ov.innerHTML=sessionIntro(d);bindSession();return;}
  const total=w.exercises.length;
  if(active.step==="rest"){ov.innerHTML=restView();bindSession();return;}
  if(active.step==="done"){ov.innerHTML=doneView(d);bindSession();return;}
  const ex=w.exercises[w.idx],t=TECH[ex.id];
  const sug=suggestion(ex.id);
  const repLabel=t.rep?`${t.rep[0]}–${t.rep[1]} reps`:(t.type==="time"?`${t.dur}s`:"");
  ov.innerHTML=`
  <div class="session">
    <div class="sess-top">
      <button class="x" data-quit>✕ Quitter</button>
      <span class="muted small">Exercice ${w.idx+1}/${total}</span>
    </div>
    <div class="sess-prog"><span style="width:${(w.idx/total)*100}%"></span></div>
    <div class="sess-body">
    ${active.step==="feedback"?feedbackView(ex,t):`
      <div class="ex-name">${ex.name}</div>
      <div class="ex-tags"><span class="tag">${t.m}</span><span class="tag rep">${ex.setsCount} × ${repLabel}</span><a class="tag vid" href="${ytUrl(ex.id)}" target="_blank" rel="noopener">▶ Vidéo</a></div>
      ${sug?`<div class="suggest ${sug.hold?'hold':''}">${sug.hold?'⏸️':'⬆️'}<span>${sug.txt}</span></div>`:""}
      <details class="technique"><summary>Voir la technique <span class="muted">▾</span></summary>
        <div class="content">${t.i}<br><br>💡 ${t.tip}${t.err!=="—"?`<br><br>⚠️ ${t.err}`:""}</div>
      </details>
      ${t.type==="time"?timeExercise(ex,t):repsInputs(ex,t)}
    `}
    </div>
    ${active.step==="feedback"?`<div class="sess-foot"><button class="btn" data-nextfromfb ${active.feedbackSel==null?'disabled style="opacity:.5"':''}>${w.idx+1<total?'Repos →':'Terminer la séance'}</button></div>`
     :(t.type!=="time"?`<div class="sess-foot"><button class="btn" data-finishex>Exercice terminé</button></div>`:"")}
  </div>`;
  bindSession();
}

  <div class="sess-body">

  </div>

function repsInputs(ex,t){
  const ph=t.rep?`${t.rep[0]}–${t.rep[1]}`:"reps";
  const unit=t.unit?` <span class="muted small">(${t.unit})</span>`:"";
  let rows=`<div class="field"><label>Poids utilisé (kg)${ex.id.startsWith('db')||['chairsquat','glutebridge'].includes(ex.id)?' — optionnel':''}</label>
    <input class="inp" data-w type="number" inputmode="decimal" step="0.5" value="${ex.weight}" placeholder="kg"></div>`;
  for(let i=0;i<ex.setsCount;i++){
    rows+=`<div class="setrow"><span class="sl">Série ${i+1}</span>
      <input class="inp" data-set="${i}" type="number" inputmode="numeric" value="${ex.sets[i]||''}" placeholder="${ph} reps${t.unit?'/côté':''}"></div>`;
  }
  rows+=`<div class="setctl"><button data-addset>+ Ajouter une série</button>${ex.setsCount>1?'<button data-rmset>– Retirer</button>':''}</div>`;
  return rows+unit;
}
function timeExercise(ex,t){
  return `<div class="card flat" style="text-align:center">
    <div style="font-size:15px;margin-bottom:14px" class="muted">${ex.name} · ${t.dur} secondes</div>
    <button class="btn teal" data-finishex>Terminé ✓</button></div>`;
}
function feedbackView(ex,t){
  const opts=["Très facile","Facile","Correct","Difficile","Très difficile"];
  return `<div class="feedback"><h3>Comment était « ${ex.name} » ?</h3>
    <div class="fbopts">${opts.map(o=>`<button class="fbopt ${active.feedbackSel===o?'sel':''}" data-fb="${o}">${o}</button>`).join("")}</div>
  </div>`;
}
function restView(){
  const pct=active.timeTotal?active.timeLeft/active.timeTotal:0;
  const r=100,c=2*Math.PI*r,off=c*(1-pct);
  return `<div class="session"><div class="sess-top"><button class="x" data-quit>✕ Quitter</button><span class="muted small">Repos</span></div>
  <div class="rest-wrap">
    <div class="ring"><svg width="230" height="230" viewBox="0 0 230 230">
      <circle cx="115" cy="115" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="14"/>
      <circle cx="115" cy="115" r="${r}" fill="none" stroke="var(--teal)" stroke-width="14" stroke-linecap="round"
        stroke-dasharray="${c}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset 1s linear"/>
    </svg><div class="num"><div class="t" id="restnum">${active.timeLeft}</div><div class="lab">secondes de repos</div></div></div>
    <div class="rest-btns">
      <button class="btn ghost" data-restadd>+ 30 s</button>
      <button class="btn teal" data-restskip>Passer le repos →</button>
    </div>
  </div></div>`;
}
function doneView(d){
  const w=active.workout;
  const mins=Math.max(1,Math.round((Date.now()-w.startTime)/60000));
  return `<div class="session"><div class="celebrate">
    <div class="em">🎉</div><h2>Belle séance, bravo !</h2>
    <div class="muted" style="margin-bottom:20px">${w.exercises.filter(e=>e.done).length} exercices · ${mins} min</div>
    <div class="card flat" style="text-align:left"><div class="card-title">Cardio (optionnel)</div>
      <div class="muted small" style="margin-bottom:10px">${d.cardio}</div>
      <div class="row2"><input class="inp" id="cardiomin" type="number" inputmode="numeric" placeholder="minutes"><span class="muted small" style="align-self:center">min de marche</span></div>
    </div>
    <div class="motiv" style="margin-top:8px">Tu construis ta routine, une séance à la fois 🌱</div>
  </div>
  <div class="sess-foot"><button class="btn" data-savesession>Enregistrer la séance</button></div></div>`;
}

/* ---------------- LOGIQUE SESSION ---------------- */
function readCurrentExercise(){
  const w=active.workout,ex=w.exercises[w.idx];
  const wi=document.querySelector('[data-w]');
  if(wi)ex.weight=wi.value?parseFloat(wi.value):"";
  document.querySelectorAll('[data-set]').forEach(el=>{ex.sets[+el.dataset.set]=el.value?parseInt(el.value):"";});
}
function startRest(){
  const w=active.workout,t=TECH[w.exercises[w.idx].id];
  active.timeTotal=t.rest;active.timeLeft=t.rest;active.step="rest";
  render();
  clearInterval(active.timer);
  active.timer=setInterval(()=>{
    active.timeLeft--;
    const el=document.getElementById("restnum");
    const ring=document.querySelector('.ring circle:last-child');
    if(el)el.textContent=Math.max(0,active.timeLeft);
    if(ring){const r=100,c=2*Math.PI*r;ring.setAttribute("stroke-dashoffset",c*(1-Math.max(0,active.timeLeft)/active.timeTotal));}
    if(active.timeLeft<=0){clearInterval(active.timer);nextExercise();}
  },1000);
}
function nextExercise(){
  clearInterval(active.timer);
  const w=active.workout;
  if(w.idx+1<w.exercises.length){w.idx++;active.step="exercise";active.feedbackSel=null;render();}
  else{active.step="done";render();}
}
function commitSession(){
  const w=active.workout;
  const cardio=document.getElementById("cardiomin");
  const mins=Math.max(1,Math.round((Date.now()-w.startTime)/60000));
  S.sessions.push({date:todayISO(),dayKey:w.dayKey,name:w.name,durationMin:mins,
    cardioMin:cardio&&cardio.value?parseInt(cardio.value):null,
    exercises:w.exercises.filter(e=>e.done).map(e=>({id:e.id,name:e.name,
      weight:e.weight===""?null:e.weight,sets:e.sets.map(s=>s===""?0:s),difficulty:e.difficulty}))});
  save();
  active.workout=null;clearInterval(active.timer);
  go("home");
}

/* ---------------- ÉVÉNEMENTS ---------------- */
function bind(){
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));
  document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>startWorkout(b.dataset.start));
  document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>openExercise(b.dataset.ex));

  if(route==="progress"){
    const addw=document.getElementById("addw");
    if(addw)addw.onclick=()=>{const v=parseFloat(document.getElementById("wkg").value);const dt=document.getElementById("wdate").value||todayISO();
      if(!isNaN(v)&&v>0){S.weights.push({date:dt,kg:v});S.weights.sort((a,b)=>new Date(a.date)-new Date(b.date));
        if(!S.celebrated)S.celebrated=[];
        const reached=MILESTONES.filter(m=>displayWeight()<=m && !S.celebrated.includes(m));
        reached.forEach(m=>S.celebrated.push(m));save();render();
        if(reached.length)openMilestone(Math.min(...reached));}};
    document.querySelectorAll('[data-ms]').forEach(b=>b.onclick=()=>openMilestone(+b.dataset.ms));
    const as=document.getElementById("addsteps");
    if(as)as.onclick=()=>{const v=parseInt(document.getElementById("steps").value);
      if(!isNaN(v)&&v>=0){S.steps.push({date:todayISO(),count:v});save();render();}};
  }
  if(route==="profile"){
    document.getElementById("savep").onclick=()=>{
      const g=id=>document.getElementById(id).value;
      S.profile.name=g("p_name").trim();
      S.profile.startWeight=parseFloat(g("p_sw"))||S.profile.startWeight;
      S.profile.goalWeight=parseFloat(g("p_gw"))||S.profile.goalWeight;
      S.profile.startDate=g("p_sd")||S.profile.startDate;
      S.profile.stepGoal=parseInt(g("p_st"))||S.profile.stepGoal;
      if(S.weights.length){S.weights[0].kg=S.profile.startWeight;S.weights[0].date=S.profile.startDate;}
      save();go("home");};
    document.getElementById("saveh").onclick=()=>{S.home.dumbbells=document.getElementById("h_db").value;save();flash("Matériel enregistré");};
    document.querySelectorAll('[data-tog]').forEach(sw=>sw.onclick=()=>{S.home[sw.dataset.tog]=!S.home[sw.dataset.tog];sw.classList.toggle("on");save();});
    document.querySelectorAll('[data-theme-btn]').forEach(b=>b.onclick=()=>{
      const m=b.dataset.themeBtn;
      if(m==="auto"){document.documentElement.removeAttribute("data-theme");localStorage.removeItem("theme");}
      else{document.documentElement.setAttribute("data-theme",m);try{localStorage.setItem("theme",m);}catch(e){}}
    });
    document.getElementById("reset").onclick=()=>{if(confirm("Effacer toutes tes données ? Cette action est définitive."))
      {try{localStorage.removeItem(KEY);}catch(e){}S=defState();save();go("home");}};
    const sec=document.querySelector('[data-secret]');if(sec)sec.onclick=openLetter;
  }
}
function bindSession(){
  const q=s=>document.querySelector(s),qa=s=>document.querySelectorAll(s);
  const quit=q('[data-quit]');if(quit)quit.onclick=()=>{if(confirm("Quitter la séance ? Elle ne sera pas enregistrée."))
    {clearInterval(active.timer);active.workout=null;go("home");}};
  const begin=q('[data-beginex]');if(begin)begin.onclick=()=>{active.workout.intro=false;render();};
  const fin=q('[data-finishex]');if(fin)fin.onclick=()=>{
    const ex=active.workout.exercises[active.workout.idx];
    if(TECH[ex.id].type!=="time")readCurrentExercise();
    ex.done=true;active.step="feedback";active.feedbackSel=null;render();};
  qa('[data-fb]').forEach(b=>b.onclick=()=>{active.feedbackSel=b.dataset.fb;
    active.workout.exercises[active.workout.idx].difficulty=b.dataset.fb;render();});
  const nfb=q('[data-nextfromfb]');if(nfb)nfb.onclick=()=>{
    if(active.feedbackSel==null)return;
    const w=active.workout;
    if(w.idx+1<w.exercises.length)startRest();else{active.step="done";render();}};
  const radd=q('[data-restadd]');if(radd)radd.onclick=()=>{active.timeLeft+=30;active.timeTotal+=30;
    const el=document.getElementById("restnum");if(el)el.textContent=active.timeLeft;};
  const rskip=q('[data-restskip]');if(rskip)rskip.onclick=()=>{clearInterval(active.timer);nextExercise();};
  const addset=q('[data-addset]');if(addset)addset.onclick=()=>{readCurrentExercise();
    active.workout.exercises[active.workout.idx].setsCount++;
    active.workout.exercises[active.workout.idx].sets.push("");render();};
  const rmset=q('[data-rmset]');if(rmset)rmset.onclick=()=>{const ex=active.workout.exercises[active.workout.idx];
    if(ex.setsCount>1){readCurrentExercise();ex.setsCount--;ex.sets.pop();render();}};
  const ss=q('[data-savesession]');if(ss)ss.onclick=commitSession;
}
function flash(msg){
  const el=document.getElementById("overlay");
  el.innerHTML=`<div style="position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;z-index:80;font-weight:600;font-size:14px">${msg}</div>`;
  setTimeout(()=>{el.innerHTML="";},1600);
}
function openLetter(){
  const el=document.getElementById("overlay");
  el.innerHTML=`<div class="letter">
    <div class="heart">🤍</div>
    <h2>Pour toi, Shekiki</h2>
    <p>Si tu lis ces mots, c'est que tu as fouillé un peu partout — et ça me fait sourire, parce que c'est tout toi.</p>
    <p>Je veux que tu saches pourquoi cette app existe. Ce n'est pas pour un chiffre sur une balance. C'est parce que je vois le bon et la beauté en toi — celle que tu portes déjà, aujourd'hui, exactement comme tu es. Je voulais seulement te donner un endroit pour qu'elle rayonne aussi à l'extérieur, à ton rythme.</p>
    <p>La confiance en soi, ce n'est pas se trouver parfaite. C'est se traiter avec douceur, se relever après les jours « off », et continuer quand même. À chaque séance, tu ne construis pas que des muscles : tu construis cette petite voix qui te dit « je suis capable ».</p>
    <p>Prendre soin de ta santé, c'est le plus beau cadeau que tu puisses t'offrir — plus d'énergie, un meilleur sommeil, l'esprit plus léger, un corps qui te porte plus fort et plus longtemps. Tu ne le fais pour personne d'autre que toi.</p>
    <p>Alors sois patiente avec toi. Sois fière d'avoir commencé. Et les jours de doute, rappelle-toi : quelqu'un voit déjà en toi tout ce que tu es en train de découvrir.</p>
    <p class="sign">Je crois en toi. 🤍</p>
    <button class="btn close" data-closeletter>Fermer</button>
  </div>`;
  document.querySelector('[data-closeletter]').onclick=()=>{el.innerHTML="";};
}
function libraryHTML(){
  return LIB.map(([cat,ids])=>`
    <div class="card-title" style="margin:16px 2px 10px">${cat}</div>
    ${ids.map(id=>{const t=TECH[id];return `<button class="libitem" data-ex="${id}">
      <div><div class="li-n">${t.n}</div><div class="li-m">${t.m}</div></div>
      <span class="li-go">▶</span></button>`;}).join("")}`).join("");
}
function openExercise(id){
  const t=TECH[id],el=document.getElementById("overlay");
  const repLabel=t.rep?`${t.rep[0]}–${t.rep[1]} reps`:(t.type==="time"?`${t.dur}s`:"");
  el.innerHTML=`<div class="exsheet">
    <button class="x2" data-closeex>✕</button>
    <div class="ex-name" style="margin-top:18px">${t.n}</div>
    <div class="ex-tags"><span class="tag">${t.m}</span><span class="tag rep">${(t.set||3)} × ${repLabel}</span></div>
    <div class="exbody">
      <p>${t.i}</p>
      <p>💡 <b>Astuce :</b> ${t.tip}</p>
      ${t.err!=="—"?`<p>⚠️ <b>Erreur fréquente :</b> ${t.err}</p>`:""}
    </div>
    <a class="btn" href="${ytUrl(id)}" target="_blank" rel="noopener">▶ Voir la vidéo sur YouTube</a>
    <button class="btn ghost" data-closeex style="margin-top:10px">Fermer</button>
  </div>`;
  el.querySelectorAll('[data-closeex]').forEach(b=>b.onclick=()=>{el.innerHTML="";});
}
function openMilestone(m){
  const el=document.getElementById("overlay");
  el.innerHTML=`<div class="letter" style="background:linear-gradient(165deg,var(--teal-soft),var(--bg) 55%,var(--berry-soft))">
    <div class="heart">🎉</div>
    <h2>${m} kg — tu l'as fait</h2>
    <p>Regarde ce que tu viens d'accomplir. Ce n'est pas qu'un chiffre : c'est des séances enchaînées, des matins où tu y es allée même sans motivation, une discipline que tu as bâtie toi-même.</p>
    <p>Chaque petit palier compte, et celui-ci est à toi. Continue tout en douceur, sans te presser — ton corps et ta tête te disent déjà merci.</p>
    <p>Je suis fière de toi. 🤍</p>
    <p class="sign">Le prochain viendra quand tu te sentiras prête, pas avant.</p>
    <button class="btn close" data-closeletter>Continuer 💪</button>
  </div>`;
  document.querySelector('[data-closeletter]').onclick=()=>{el.innerHTML="";};
}

/* ---------------- INIT ---------------- */
(function(){try{const t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
render();
</script>
</body>
</html>
